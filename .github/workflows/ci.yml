name: CI

# `main` here is upstream's line, which this fork does not develop on: our work
# lands on `feat/doc-context-directive` (the fork line) and is shipped to PDLC as
# a `vX.Y.Z-ruN` tag built from source. Listening on `main` alone left the line
# with no CI at all — every check below was dead weight on the branch that
# actually receives commits.
on:
  push:
    branches: [main, feat/doc-context-directive]
  pull_request:
    branches: [main, feat/doc-context-directive]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        # Gate ALL dependencies (prod + dev) at high severity. Transitive advisories
        # inside dev tooling (@earendil-works/pi-coding-agent → @google/genai →
        # protobufjs/ws) are pinned to patched versions via `overrides`, so the full
        # tree is clean — no need to scope dev out.
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      # No artifact upload: actions/upload-artifact@v4+ refuses to run outside
      # github.com (`GHESNotSupportedError`), and our Actions live on the self-hosted
      # Gitea — the first real run of this job failed on exactly that, with the build
      # itself green. Nothing in our contour consumed the artifact anyway: PDLC
      # installs openlore by BUILDING IT FROM SOURCE at a pinned tag. Keeping a step
      # that can only fail would leave the job permanently red for no signal.

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed!"
