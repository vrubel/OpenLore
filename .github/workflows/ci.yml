name: CI

# `main` here is upstream's line, which this fork does not develop on: our work
# lands on `feat/doc-context-directive` (the fork line) and is shipped to PDLC as
# a `vX.Y.Z-ruN` tag built from source. Listening on `main` alone left the line
# with no CI at all — every check below was dead weight on the branch that
# actually receives commits.
on:
  push:
    branches: [main, feat/doc-context-directive]
  pull_request:
    branches: [main, feat/doc-context-directive]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        # Gate ALL dependencies (prod + dev) at high severity. Transitive advisories
        # inside dev tooling (@earendil-works/pi-coding-agent → @google/genai →
        # protobufjs/ws) are pinned to patched versions via `overrides`, so the full
        # tree is clean — no need to scope dev out.
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm run test:run

      # The integration suite had never run in CI. `vitest.config.ts` excludes
      # `*.integration.test.ts` and this job only ran `test:run`, so 18 files —
      # the MCP transport conformance and e2e specs, the watcher, the analyzer
      # regression suite — were collected by nobody. They were not slow or
      # flaky; they were simply invisible. A gate that reports green over tests
      # it does not execute is worse than no gate: it is a false witness, and it
      # let real defects through review twice.
      #
      # Added as a STEP of this job rather than a fourth parallel job on
      # purpose: this runner shares one workspace directory between concurrent
      # jobs, and two `npm ci` starting in the same second have already
      # deadlocked a run (2216). Sequential here costs ~45s and races nothing.
      #
      # live-data is excluded, and that exclusion is a decision, not an
      # oversight: it clones third-party repositories over the network and
      # asserts golden snapshots of their analysis, so it needs egress and a
      # warm cache to be meaningful. It is ALSO currently failing on a real
      # snapshot drift (java-commons-cli totalEdges 443 → 449) that predates
      # this change and deserves its own fix rather than a silent skip here.
      # Everything else in the suite passes.
      # Build BEFORE the integration suite, and not for the artifact: parts of that
      # suite exercise the built CLI and guard themselves with
      # `describe.skipIf(!existsSync(dist/cli/index.js))`. Without a build they do
      # not fail — they SKIP, silently, and the job stays green. The first green run
      # of this very step reported "16 passed | 1 skipped": 23 panic e2e tests had
      # quietly not run. That is the same false-witness defect this change exists to
      # remove, so it does not get to survive inside the fix for it.
      - name: Build (integration specs exercise the built CLI)
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration -- --exclude '**/live-data/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      # No artifact upload: actions/upload-artifact@v4+ refuses to run outside
      # github.com (`GHESNotSupportedError`), and our Actions live on the self-hosted
      # Gitea — the first real run of this job failed on exactly that, with the build
      # itself green. Nothing in our contour consumed the artifact anyway: PDLC
      # installs openlore by BUILDING IT FROM SOURCE at a pinned tag. Keeping a step
      # that can only fail would leave the job permanently red for no signal.

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed!"
