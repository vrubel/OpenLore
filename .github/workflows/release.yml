name: Release

# UPSTREAM'S RELEASE PATH — DISARMED ON THE FORK LINE. Kept for reference and for
# a clean merge with upstream; it must not fire here.
#
# It publishes `openlore` to npm with provenance via npm Trusted Publishing (OIDC)
# and creates a GitHub Release through api.github.com. This fork has neither: PDLC
# installs openlore by BUILDING IT FROM SOURCE at a pinned tag
# (core/scripts/forks.lst), and our golden source is a self-hosted Gitea.
#
# Worse than useless, the automatic tag trigger was actively harmful: the
# `Verify tag matches package.json version` step below compares the tag name with
# package.json's version, and our tag convention `vX.Y.Z-ruN` over upstream's
# version `X.Y.Z` CANNOT match by construction. Every one of the 17 tags pushed on
# this line since 2026-07-15 went red there — and because the step sits fourth,
# lint/typecheck/tests/build were reported as `skipped` on all of them. A red badge
# that never once ran a test reads like "the fork's code is checked and failing"
# when in fact nothing was checked at all. Real checks now live in ci.yml, which
# runs on this line's pushes and PRs.
#
# Left as `workflow_dispatch` only: it cannot start by itself, and a deliberate
# manual run is still the way to reach upstream's publishing path if this fork ever
# needs it (the version guard would have to be reconciled with `-ruN` first).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.2). Must already exist on origin.'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_dispatch → the explicitly-named tag.
          # push (tag) and release events → github.ref already points at the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Fail fast and loud if the tag doesn't match package.json's version.
      # Without this, a tag pushed without the matching `chore(release)` bump
      # sails through validate and dies late in `npm publish` with the cryptic
      # "cannot publish over the previously published version" (this is exactly
      # how the first v2.0.6 publish failed). Catch it here with a clear message.
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'. Bump package.json + package-lock.json in a chore(release) commit, retag at that commit, and re-run."
            exit 1
          fi
          echo "Tag '$TAG' matches package.json version '$PKG'."

      # The release gate must run WHAT THE PR GATE RUNS, or it is not a gate — it is
      # a second, weaker opinion that happens to be the one standing between a tag
      # and a publish. Kept deliberately in step with ci.yml: audit + lint +
      # typecheck + unit + build + integration, in that order. If you add a check
      # there, add it here.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      # Build BEFORE the integration suite, and not merely for the artifact:
      # several integration specs exercise the BUILT CLI and guard themselves with
      # `describe.skipIf(!existsSync(dist/cli/index.js))`. Without a build they do
      # not fail — they SKIP, silently, and the job stays green. That is precisely
      # how 23 panic e2e tests went unrun in ci.yml until someone read the log.
      - name: Build
        run: npm run build

      # live-data is excluded for the same reason as in ci.yml, and it is a
      # decision rather than an oversight: it clones third-party repositories over
      # the network and asserts golden snapshots of their analysis, and it is
      # currently red on a real snapshot drift (java-commons-cli totalEdges
      # 443 → 449) that predates this change and deserves its own fix.
      - name: Run integration tests
        run: npm run test:integration -- --exclude '**/live-data/**'

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    # Only the tag-push path creates the Release. On `release: published` the
    # Release already exists; on workflow_dispatch we re-publish an existing tag.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Create the Release for this tag with auto-generated notes, unless one
      # already exists (idempotent — safe to re-run). Created with GITHUB_TOKEN,
      # so it deliberately does NOT fire another `release: published` run.
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    # Run after validate succeeds and create-release either succeeded (tag-push)
    # or was skipped (release / workflow_dispatch paths).
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    # `id-token: write` is required for npm Trusted Publishing (OIDC) and for
    # `npm publish --provenance` to mint an attestation.
    permissions:
      contents: read
      id-token: write
    # Scopes the OIDC token to a named environment so npm's Trusted Publisher
    # config can require it. Create this environment under repo
    # Settings → Environments before enabling Trusted Publishing.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/openlore
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN — npm picks up the OIDC token automatically when
      # `id-token: write` is set and the package is configured for Trusted
      # Publishing on npmjs.com. --provenance attaches a signed attestation
      # linking this build to this repo + this workflow run.
      - name: Publish to npm
        run: npm publish --provenance --access public
